name: SonarQube Scan (Java/Maven)

on:
  push:
    branches: [sonar]
#  pull_request:
 #   types: [opened, synchronize, reopened]

jobs:
  sonar-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate blame/history analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '21' or your specific Spring Boot Java version
          distribution: 'temurin'
          cache: 'maven' # Speeds up subsequent builds by caching dependencies

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Leave out if using SonarCloud
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=My-Spring-APP \
            -Dsonar.projectName="Your Spring Boot App"
